<!doctype html>
<html lang="en" data-theme="grape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0e">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<title>Studio · M-ID</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/themes.css?v=4" />
<link rel="stylesheet" href="/assets/maple-theme.css?v=4" />
<link rel="stylesheet" href="/assets/maple.css?v=3" />
<link rel="stylesheet" href="/assets/glass.css?v=4" />
<link rel="stylesheet" href="/assets/card-ui.css?v=2" />
<link rel="stylesheet" href="/assets/maple-ui.css?v=5" />
<link rel="stylesheet" href="/assets/studio.css?v=3" />
<style>
  /* page-only layout helpers; colours, type and buttons come from the site's stylesheets */
  .st-page{max-width:1180px;margin:0 auto;padding:12px 16px 120px}
  .st-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .st-top h1{font-size:20px;margin:0;font-weight:700}
  .st-top .eyebrow{font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
  .st-msg{min-height:1.3em;font-size:13px;margin:10px 4px 0}
  .st-msg.err{color:#ff7b82}
  .st-msg.ok{color:#7fd8a6}
  .st-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .st-wide{grid-column:1/-1}
  .st-rows{display:grid;gap:8px}
  .st-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center}
  .st-row input{width:100%}
  .st-add{margin-top:8px}
  .st-note{padding:14px;border:1px dashed var(--line);border-radius:14px;font-size:14px;opacity:.85}
  @media (max-width:640px){.st-grid{grid-template-columns:1fr}.st-row{grid-template-columns:1fr 1fr auto}}
  .st-page .field input[type=color]{height:42px;padding:3px;width:64px}
</style>
</head>
<body>
<main class="st-page" id="app"><p class="st-note">Loading…</p></main>
<script>
(function () {
  'use strict';

  var SB_URL = 'https://qebbuxixnqsqjuprfpyv.supabase.co';
  var SB_KEY = 'sb_publishable_Qv4cn8rMnLdciXrOR6EjVg_AmG8vMIV';
  var OWNER_EMAIL = 'abdulfarizi15@gmail.com';
  var HEX = /^#[0-9a-f]{6}$/i;
  var MEDIA_RE = /^(https?:\/\/\S+|data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+)$/i;
  var FRAMES = ['', 'dragon', 'phoenix', 'celestial', 'tech', 'cyber', 'reactor', 'neon', 'kitty', 'cloudkitty', 'starbunny', 'mooncat', 'garden'];
  var CURRENCIES = ['auto', 'MYR', 'SGD', 'IDR', 'BND', 'PHP', 'THB', 'USD'];
  var MAPLE_DEFAULTS = { layout: 'star', theme: 'maple', timezone: 'Asia/Kuala_Lumpur', openTime: '00:00', closeTime: '00:00', cardTag: 'ID / 001' };

  // Every field this page can edit. Only edited fields are written back.
  var SPEC = {
    name: { l: 'Display name', t: 'text', max: 80 },
    role: { l: 'Role', t: 'text', max: 60 },
    bio: { l: 'Bio', t: 'textarea', max: 300, wide: 1 },
    country: { l: 'Country', t: 'text', max: 40 },
    city: { l: 'City', t: 'text', max: 60 },
    timezone: { l: 'Timezone (e.g. Asia/Kuala_Lumpur)', t: 'text', max: 60 },
    openTime: { l: 'Open time', t: 'time' },
    closeTime: { l: 'Close time', t: 'time' },
    avatar: { l: 'Avatar image (https link)', t: 'text', max: 600000, wide: 1 },
    banner: { l: 'Banner image (https link)', t: 'text', max: 600000, wide: 1 },
    layout: { l: 'Card layout', t: 'select', opts: ['basic', 'star', 'builder', 'deck'] },
    theme: { l: 'Theme', t: 'text', max: 24 },
    accent: { l: 'Accent colour', t: 'color' },
    accent2: { l: 'Second colour', t: 'color' },
    cardStyle: { l: 'Card style', t: 'select', opts: ['default', 'outline', 'solid', 'neon', 'bubble', 'tinted'] },
    avatarShape: { l: 'Avatar shape', t: 'select', opts: ['circle', 'rounded', 'square'] },
    frame: { l: 'Avatar frame', t: 'select', opts: FRAMES },
    cardTag: { l: 'Card tag (e.g. ID / 001)', t: 'text', max: 24 },
    statusText: { l: 'Status line', t: 'text', max: 90, wide: 1 },
    footerText: { l: 'Footer text', t: 'text', max: 40 },
    donate: { l: 'Donate link or SociaBuzz name', t: 'text', max: 300, wide: 1 },
    donateLabel: { l: 'Donate button label', t: 'text', max: 24 },
    contactPhone: { l: 'Phone', t: 'text', max: 30 },
    contactEmail: { l: 'Email', t: 'text', max: 120 },
    shopWhatsApp: { l: 'WhatsApp number', t: 'text', max: 120 },
    shopTitle: { l: 'Shop title', t: 'text', max: 60 },
    shopNote: { l: 'Shop note', t: 'textarea', max: 200, wide: 1 },
    currency: { l: 'Currency', t: 'select', opts: CURRENCIES },
    intro: { t: 'toggle', l: 'Intro animation' },
    showVisits: { t: 'toggle', l: 'Show visit count' },
    showTime: { t: 'toggle', l: 'Show local time' },
    showReactions: { t: 'toggle', l: 'Show reactions' },
    showCta: { t: 'toggle', l: 'Show contact buttons' },
    confetti: { t: 'toggle', l: 'Confetti effect' },
    sfx: { t: 'toggle', l: 'Sound effects' },
    music: { t: 'toggle', l: 'Background music' },
    themeSwitch: { t: 'toggle', l: 'Theme switch button' },
    grid: { t: 'toggle', l: 'Grid background' },
    shopEnabled: { t: 'toggle', l: 'Show shop on my card' }
  };

  // Repeating lists: each row has two text fields (a, b)
  var ROWS = {
    channels: { l: 'Channels', a: 'platform', b: 'value', max: 24 },
    gaming: { l: 'Gaming profiles', a: 'platform', b: 'value', max: 24 },
    specs: { l: 'Specs', a: 'label', b: 'value', max: 12 }
  };

  var TABS = [
    { id: 'profile', label: 'Profile', icon: 'fa-user', sections: [
      { title: 'Identity', fields: ['name', 'role', 'bio'] },
      { title: 'Location & hours', fields: ['country', 'city', 'timezone', 'openTime', 'closeTime'] },
      { title: 'Images', fields: ['avatar', 'banner'] }
    ] },
    { id: 'look', label: 'Look', icon: 'fa-palette', sections: [
      { title: 'Layout & theme', fields: ['layout', 'theme', 'cardStyle'] },
      { title: 'Colours', fields: ['accent', 'accent2'] },
      { title: 'Avatar', fields: ['avatarShape', 'frame'] },
      { title: 'Card text', fields: ['cardTag', 'statusText', 'footerText'] }
    ] },
    { id: 'links', label: 'Links', icon: 'fa-link', sections: [
      { title: 'Contact', fields: ['contactPhone', 'contactEmail', 'shopWhatsApp'] },
      { title: 'Donate', fields: ['donate', 'donateLabel'] }
    ], rows: ['channels', 'gaming'] },
    { id: 'extras', label: 'Extras', icon: 'fa-sliders', toggles: ['intro', 'showVisits', 'showTime', 'showReactions', 'showCta', 'confetti', 'sfx', 'music', 'themeSwitch', 'grid'], rows: ['specs'] },
    { id: 'shop', label: 'Shop', icon: 'fa-bag-shopping', sections: [
      { title: 'Shop', fields: ['shopTitle', 'shopNote', 'currency'] }
    ], toggles: ['shopEnabled'] },
    { id: 'media', label: 'Media', icon: 'fa-music', media: true }
  ];

  var S = null; // { token, uid, raw, data, dirty, tab }

  function $(sel) { return document.querySelector(sel); }
  function clampStr(v, max) { return String(v == null ? '' : v).trim().slice(0, max); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- session ----------
  function readCookie(name) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }
  function decodeJwt(t) {
    try {
      var p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      p += '='.repeat((4 - (p.length % 4)) % 4);
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return null; }
  }
  function session() {
    var cands = [];
    var c = readCookie('nf_jwt');
    if (c) cands.push(c);
    try {
      var g = JSON.parse(localStorage.getItem('gotrue.user') || 'null');
      if (g && g.token && g.token.access_token) cands.push(g.token.access_token);
    } catch (e) {}
    var best = null, bestClaims = null;
    cands.forEach(function (t) {
      var cl = decodeJwt(t);
      if (cl && cl.sub && (!bestClaims || cl.exp > bestClaims.exp)) { best = t; bestClaims = cl; }
    });
    if (!best) return null;
    if (bestClaims.exp * 1000 - Date.now() < 15000) return null; // token about to expire: reload the main site first
    return { token: best, uid: bestClaims.sub, email: String(bestClaims.email || '').toLowerCase() };
  }

  // ---------- database ----------
  function sb(path, o) {
    o = o || {};
    var h = { apikey: SB_KEY, Authorization: 'Bearer ' + o.token, 'Content-Type': 'application/json' };
    if (o.prefer) h.Prefer = o.prefer;
    return fetch(SB_URL + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined });
  }
  // The profile is stored as one JSON string in the `name` column (prefix {"__dig":).
  function parseRow(row) {
    var raw = {};
    if (typeof row.name === 'string' && row.name.indexOf('{"__dig":') === 0) {
      try { raw = JSON.parse(row.name); } catch (e) {}
    } else {
      raw = { name: row.name || 'Creator' };
    }
    delete raw.__dig; delete raw.likes; delete raw.visits; delete raw.reactions; delete raw.id;
    return raw;
  }

  // ---------- cleaning (same rules the main site applies) ----------
  function cleanDonate(v) {
    v = String(v || '').trim().replace(/^@/, '');
    if (!v) return '';
    if (/^[A-Za-z0-9_.-]{1,60}$/.test(v)) return 'https://sociabuzz.com/' + v + '/donate';
    try {
      var u = new URL(/^https?:\/\//i.test(v) ? v : 'https://' + v);
      if (!/^https?:$/.test(u.protocol) || u.hostname.indexOf('.') < 0) return '';
      return u.toString().slice(0, 300);
    } catch (e) { return ''; }
  }
  function cleanOne(k, v) {
    var s = SPEC[k];
    if (s.t === 'toggle') return v === true || v === 'true';
    if (s.t === 'select') return s.opts.indexOf(v) >= 0 ? v : s.opts[0];
    if (s.t === 'color') return HEX.test(v || '') ? v : '';
    if (s.t === 'time') return /^\d{2}:\d{2}$/.test(v || '') ? v : '00:00';
    if (k === 'name') return clampStr(v, 80) || 'Creator';
    if (k === 'donate') return cleanDonate(v);
    if (k === 'contactEmail') {
      v = clampStr(v, 120);
      if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) throw new Error('Check the email address.');
      return v;
    }
    if (k === 'avatar' || k === 'banner') {
      v = clampStr(v, 600000);
      if (v && !MEDIA_RE.test(v)) throw new Error((k === 'avatar' ? 'Avatar' : 'Banner') + ' must be a full https:// link.');
      return v;
    }
    return clampStr(v, s.max || 200);
  }
  function cleanRows(k, arr) {
    var R = ROWS[k];
    return (Array.isArray(arr) ? arr : []).slice(0, R.max).map(function (r) {
      var o = {};
      o[R.a] = clampStr(r && r[R.a], 60);
      o[R.b] = clampStr(r && r[R.b], 200);
      return o;
    }).filter(function (o) { return o[R.a] && o[R.b]; });
  }

  // ---------- rendering (uses the Studio classes from studio.css) ----------
  function fieldHtml(k) {
    var s = SPEC[k], v = S.data[k] == null ? '' : S.data[k];
    var cls = s.wide ? ' st-wide' : '';
    var lbl = '<label for="f-' + k + '">' + s.l + '</label>';
    var input;
    if (s.t === 'textarea') {
      input = '<textarea id="f-' + k + '" data-k="' + k + '" maxlength="' + s.max + '">' + esc(v) + '</textarea>';
    } else if (s.t === 'select') {
      input = '<select id="f-' + k + '" data-k="' + k + '">' + s.opts.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + (o || 'None') + '</option>';
      }).join('') + '</select>';
    } else if (s.t === 'color') {
      input = '<input id="f-' + k + '" type="color" data-k="' + k + '" value="' + (HEX.test(v) ? v : '#000000') + '">';
    } else if (s.t === 'time') {
      input = '<input id="f-' + k + '" type="time" data-k="' + k + '" value="' + esc(v) + '">';
    } else {
      input = '<input id="f-' + k + '" type="text" data-k="' + k + '" maxlength="' + Math.min(s.max, 2000) + '" value="' + esc(v) + '">';
    }
    return '<div class="field' + cls + '">' + lbl + input + '</div>';
  }
  function toggleHtml(k) {
    var on = S.data[k] === true || S.data[k] === 'true';
    return '<label class="toggle"><span>' + SPEC[k].l + '</span><input type="checkbox" data-k="' + k + '"' + (on ? ' checked' : '') + '></label>';
  }
  function rowsHtml(k) {
    var R = ROWS[k], rows = S.data[k] || [];
    return '<div class="st-rows">' + rows.map(function (r, i) {
      return '<div class="st-row">' +
        '<input type="text" data-rk="' + k + '" data-i="' + i + '" data-p="' + R.a + '" maxlength="60" value="' + esc(r[R.a]) + '" placeholder="' + R.a + '">' +
        '<input type="text" data-rk="' + k + '" data-i="' + i + '" data-p="' + R.b + '" maxlength="200" value="' + esc(r[R.b]) + '" placeholder="' + R.b + '">' +
        '<button class="btn" type="button" data-del="' + k + '" data-i="' + i + '" aria-label="Remove"><i class="fa-solid fa-xmark"></i></button></div>';
    }).join('') + '</div><button class="btn st-add" type="button" data-add="' + k + '"><i class="fa-solid fa-plus"></i> Add ' + R.l.toLowerCase().replace(/s$/, '') + '</button>';
  }
  function sectionHtml(title, inner) {
    return '<fieldset><legend>' + title + '</legend>' + inner + '</fieldset>';
  }
  function panelHtml(id) {
    var T = TABS.filter(function (t) { return t.id === id; })[0] || TABS[0];
    if (T.media) {
      return sectionHtml('Music & anime', '<div class="st-note">Music, anime and lyrics are still edited in the current Studio. ' +
        '<a href="/studio">Open the current Studio</a>. They move here in the next update.</div>');
    }
    var h = '';
    (T.sections || []).forEach(function (sec) {
      h += sectionHtml(sec.title, '<div class="st-grid">' + sec.fields.map(fieldHtml).join('') + '</div>');
    });
    if (T.toggles) h += sectionHtml('Options', T.toggles.map(toggleHtml).join(''));
    (T.rows || []).forEach(function (k) { h += sectionHtml(ROWS[k].l, rowsHtml(k)); });
    return h;
  }
  function render() {
    $('#app').innerHTML =
      '<div class="st-top"><div><div class="eyebrow">Studio</div><h1>Your card</h1></div>' +
      '<a class="btn" href="/maple" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View card</a></div>' +
      '<div class="studio-grid"><form class="editor" id="editor" onsubmit="return false">' +
      '<div class="tabs" role="tablist">' + TABS.map(function (t) {
        return '<button class="tab' + (t.id === S.tab ? ' active' : '') + '" type="button" role="tab" data-tab="' + t.id + '"><i class="fa-solid ' + t.icon + '"></i> ' + t.label + '</button>';
      }).join('') + '</div>' +
      '<div class="tab-panel" id="panel">' + panelHtml(S.tab) + '</div>' +
      '<div class="savebar"><span class="save-state" id="state"></span>' +
      '<button class="btn primary" type="button" id="save"><i class="fa-solid fa-floppy-disk"></i> Save</button></div>' +
      '<p class="st-msg" id="msg" role="status"></p>' +
      '</form></div>';
    updateBar();
  }
  function renderPanel() { $('#panel').innerHTML = panelHtml(S.tab); updateBar(); }
  function updateBar() {
    var st = $('#state'), b = $('#save');
    if (!S || !st || !b) return;
    var n = Object.keys(S.dirty).length;
    st.textContent = n ? 'Unsaved changes' : 'All changes saved';
    st.className = n ? 'save-state dirty' : 'save-state';
    b.disabled = !n;
  }
  function showMsg(text, isErr) {
    var m = $('#msg');
    if (m) { m.textContent = text; m.className = 'st-msg ' + (isErr ? 'err' : 'ok'); }
  }
  function notice(text) { $('#app').innerHTML = '<div class="st-note">' + esc(text) + '</div>'; }
  function mark(k) { S.dirty[k] = true; updateBar(); }

  // ---------- save ----------
  function save() {
    if (!S || !Object.keys(S.dirty).length) return;
    var out = {};
    try {
      Object.keys(S.dirty).forEach(function (k) {
        out[k] = ROWS[k] ? cleanRows(k, S.data[k]) : cleanOne(k, S.data[k]);
      });
    } catch (e) { return showMsg(e.message, true); }

    // Start from what is stored, change only the edited keys, keep everything else as it was.
    var packed = Object.assign({ __dig: 1 }, S.raw, out);
    packed.slug = 'maple';
    if (!packed.name) packed.name = S.data.name || 'Creator';
    var body = JSON.stringify(packed);
    if (body.length > 1500000) return showMsg('Your card is too large. Remove a few images and try again.', true);

    $('#save').disabled = true;
    showMsg('Saving…', false);
    sb('/rest/v1/profiles?id=eq.' + encodeURIComponent(S.uid), {
      method: 'PATCH', token: S.token, prefer: 'return=representation', body: { name: body }
    }).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (er) {
          throw new Error(er.message || 'Could not save. Please try again.');
        });
      }
      return res.json();
    }).then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) throw new Error('Not allowed to edit this profile.');
      var copy = Object.assign({}, packed);
      delete copy.__dig;
      S.raw = copy;
      S.dirty = {};
      updateBar();
      showMsg('Saved. Your card is updated.', false);
    }).catch(function (e) {
      showMsg(e.message, true);
      updateBar();
    });
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    if (!S) return;
    var t = e.target.closest('[data-tab]');
    if (t) { S.tab = t.getAttribute('data-tab'); render(); return; }
    var add = e.target.closest('[data-add]');
    if (add) {
      var ka = add.getAttribute('data-add');
      var blank = {}; blank[ROWS[ka].a] = ''; blank[ROWS[ka].b] = '';
      S.data[ka] = (S.data[ka] || []).concat([blank]);
      mark(ka); renderPanel(); return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      var kd = del.getAttribute('data-del');
      S.data[kd] = S.data[kd].filter(function (_, i) { return i !== +del.getAttribute('data-i'); });
      mark(kd); renderPanel(); return;
    }
    if (e.target.closest('#save')) save();
  });
  function onEdit(e) {
    if (!S) return;
    var el = e.target;
    if (el.getAttribute('data-k')) {
      var k = el.getAttribute('data-k');
      S.data[k] = el.type === 'checkbox' ? el.checked : el.value;
      mark(k);
    } else if (el.getAttribute('data-rk')) {
      var kr = el.getAttribute('data-rk'), i = +el.getAttribute('data-i');
      S.data[kr][i][el.getAttribute('data-p')] = el.value;
      mark(kr);
    }
  }
  document.addEventListener('input', onEdit);
  document.addEventListener('change', onEdit);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  // ---------- boot ----------
  function boot() {
    var s = session();
    if (!s) return notice('Log in on the main site first, then reload this page.');
    if (s.email !== OWNER_EMAIL) return notice('Page not found.');
    sb('/rest/v1/profiles?slug=eq.maple&select=*', { token: s.token }).then(function (r) {
      if (!r.ok) throw new Error('Could not load your profile. Please try again.');
      return r.json();
    }).then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) throw new Error('Profile not found.');
      var row = rows[0];
      if (row.id !== s.uid) throw new Error('Not allowed.');
      var raw = parseRow(row);
      S = {
        token: s.token,
        uid: s.uid,
        raw: raw,
        data: Object.assign({}, MAPLE_DEFAULTS, JSON.parse(JSON.stringify(raw))),
        dirty: {},
        tab: 'profile'
      };
      render();
    }).catch(function (e) { notice(e.message); });
  }
  boot();
})();
</script>
</body>
</html>
