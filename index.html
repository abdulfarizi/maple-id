    <!-- Supabase Client CDN & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://qebbuxixnqsquprfpyv.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_Qv4cn8rMnLdciXrOR6EjVg_AmG8vMIV';
      window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <!-- Universal Supabase API Bridge -->
    
<script>
  window.addEventListener('load', () => {
    if (!window.supabaseClient) return;
    const client = window.supabaseClient;
    const originalFetch = window.fetch;
    let isInternalCall = false;

    window.fetch = async function(url, options = {}) {
      if (isInternalCall) {
        return originalFetch.apply(this, arguments);
      }

      if (typeof url === 'string') {
        // 1. Slug availability check
        if (url.startsWith('/api/slugs/')) {
          const slug = url.split('/api/slugs/')[1];
          try {
            isInternalCall = true;
            const { data } = await client.from('profiles').select('slug').eq('slug', slug).maybeSingle();
            isInternalCall = false;
            return new Response(JSON.stringify({ available: !data, reason: data ? 'Already claimed' : null }), {
              status: 200, headers: { 'Content-Type': 'application/json' }
            });
          } catch (err) {
            isInternalCall = false;
            return new Response(JSON.stringify({ available: false, reason: err.message }), { status: 500 });
          }
        }

        // 2. Public profile fetch: /api/profiles/:slug
        if (url.startsWith('/api/profiles/') && !url.includes('/like') && !url.includes('/react')) {
          const parts = url.split('/');
          const slug = parts[3];
          try {
            isInternalCall = true;
            let { data } = await client.from('profiles').select('*').eq('slug', slug).maybeSingle();
            isInternalCall = false;
            if (!data && slug === 'maple') {
              data = {
                slug: 'maple',
                name: 'ᴍᴀᴘʟᴇ☆',
                role: 'Digital Creator',
                city: 'Masai',
                country: 'Malaysia',
                visits: 1384,
                likes: 217,
                reactions: { fire: 12, hundred: 8, rocket: 15, star: 20 },
                theme: 'flame',
                timezone: 'Asia/Kuala_Lumpur',
                gaming: [{ platform: 'Roblox', value: 'wzii_' }, { platform: 'Mobile Legends', value: '37704847' }],
                channels: [{ platform: 'YouTube', value: '@w._zii' }, { platform: 'WhatsApp', value: 'wzii1' }]
              };
            }
            if (!data) return new Response(JSON.stringify({ error: 'Profile not found' }), { status: 404 });
            return new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            isInternalCall = false;
            return new Response(JSON.stringify({ error: err.message }), { status: 500 });
          }
        }

        // 3. Profile likes / reactions
        if (url.includes('/like') || url.includes('/react')) {
          return new Response(JSON.stringify({ likes: 218, reactions: { fire: 13, hundred: 8, rocket: 15, star: 20 } }), {
            status: 200, headers: { 'Content-Type': 'application/json' }
          });
        }

        // 4. Signup / Auth
        if (url.includes('/.netlify/identity/signup') || url.includes('/signup')) {
          try {
            let body = {};
            try { body = JSON.parse(options.body || '{}'); } catch {}
            const { email, password, data: meta } = body;
            
            isInternalCall = true;
            const { data, error } = await client.auth.signUp({ email, password, options: { data: meta || {} } });
            isInternalCall = false;
            if (error) throw error;

            if (meta?.digital_slug && data.user) {
              isInternalCall = true;
              await client.from('profiles').upsert({ id: data.user.id, slug: meta.digital_slug, name: meta.full_name || 'Creator' });
              isInternalCall = false;
            }

            return new Response(JSON.stringify({
              id: data.user?.id, email: data.user?.email, confirmed_at: new Date().toISOString(),
              access_token: data.session?.access_token || 'dummy_token', refresh_token: data.session?.refresh_token || 'dummy_refresh'
            }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            isInternalCall = false;
            return new Response(JSON.stringify({ msg: err.message }), { status: 422, headers: { 'Content-Type': 'application/json' } });
          }
        }

        // 5. Login / Token
        if (url.includes('/.netlify/identity/token') || url.includes('/token')) {
          try {
            let email = '', password = '';
            if (typeof options.body === 'string' && options.body.includes('grant_type=password')) {
              const params = new URLSearchParams(options.body);
              email = params.get('username'); password = params.get('password');
            } else {
              const body = JSON.parse(options.body || '{}');
              email = body.email; password = body.password;
            }

            isInternalCall = true;
            const { data, error } = await client.auth.signInWithPassword({ email, password });
            isInternalCall = false;
            if (error) throw error;

            return new Response(JSON.stringify({
              access_token: data.session.access_token, refresh_token: data.session.refresh_token,
              token_type: 'bearer', expires_in: data.session.expires_in
            }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            isInternalCall = false;
            return new Response(JSON.stringify({ error: 'invalid_grant', error_description: err.message }), { status: 400, headers: { 'Content-Type': 'application/json' } });
          }
        }

        // 6. Current User Profile (/api/me)
        if (url === '/api/me' || url.includes('/.netlify/identity/user')) {
          try {
            isInternalCall = true;
            const { data: { user } } = await client.auth.getUser();
            isInternalCall = false;
            if (!user) return new Response(JSON.stringify({ error: 'Unauthorized' }), { status: 401 });

            if (options.method === 'PUT') {
              const body = JSON.parse(options.body || '{}');
              isInternalCall = true;
              const { data, error } = await client.from('profiles').upsert({ id: user.id, ...body }).select().single();
              isInternalCall = false;
              if (error) throw error;
              return new Response(JSON.stringify({ profile: data }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            isInternalCall = true;
            const { data: profile } = await client.from('profiles').select('*').eq('id', user.id).maybeSingle();
            isInternalCall = false;

            return new Response(JSON.stringify({ profile: profile || { slug: user.user_metadata?.digital_slug, name: user.user_metadata?.full_name } }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            isInternalCall = false;
            return new Response(JSON.stringify({ error: err.message }), { status: 500 });
          }
        }
      }
      return originalFetch.apply(this, arguments);
    };
  });
</script>
