    <!-- Direct REST Supabase Bridge (Zero SDK parsing issues) -->
    
<script>
  window.addEventListener('load', () => {
    const SUPABASE_URL = 'https://qebbuxixnqsquprfpyv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Qv4cn8rMnLdciXrOR6EjVg_AmG8vMIV';
    const originalFetch = window.fetch;

    window.fetch = async function(url, options = {}) {
      if (typeof url === 'string') {
        
        // 1. Slug availability check
        if (url.startsWith('/api/slugs/')) {
          const slug = url.split('/api/slugs/')[1];
          try {
            const res = await originalFetch(`${SUPABASE_URL}/rest/v1/profiles?select=slug&slug=eq.${encodeURIComponent(slug)}`, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            const exists = Array.isArray(data) && data.length > 0;
            return new Response(JSON.stringify({ available: !exists, reason: exists ? 'Already claimed' : null }), {
              status: 200, headers: { 'Content-Type': 'application/json' }
            });
          } catch (err) {
            return new Response(JSON.stringify({ available: true }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          }
        }

        // 2. Signup / Auth
        if (url.includes('/.netlify/identity/signup') || url.includes('/signup')) {
          try {
            let body = {};
            try { body = JSON.parse(options.body || '{}'); } catch {}
            const { email, password, data: meta } = body;
            
            const res = await originalFetch(`${SUPABASE_URL}/auth/v1/signup`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
              body: JSON.stringify({ email, password, data: meta || {} })
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.msg || json.error_description || 'Signup failed');

            if (meta?.digital_slug && json.user) {
              await originalFetch(`${SUPABASE_URL}/rest/v1/profiles`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates' },
                body: JSON.stringify({ id: json.user.id, slug: meta.digital_slug, name: meta.full_name || 'Creator' })
              });
            }

            return new Response(JSON.stringify({
              id: json.user?.id, email: json.user?.email, confirmed_at: new Date().toISOString(),
              access_token: json.access_token || 'token', refresh_token: json.refresh_token || 'refresh'
            }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            return new Response(JSON.stringify({ msg: err.message }), { status: 422, headers: { 'Content-Type': 'application/json' } });
          }
        }

        // 3. Login / Token
        if (url.includes('/.netlify/identity/token') || url.includes('/token')) {
          try {
            let email = '', password = '';
            if (typeof options.body === 'string' && options.body.includes('grant_type=password')) {
              const params = new URLSearchParams(options.body);
              email = params.get('username'); password = params.get('password');
            } else {
              const body = JSON.parse(options.body || '{}');
              email = body.email; password = body.password;
            }

            const res = await originalFetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
              body: JSON.stringify({ email, password })
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error_description || json.msg || 'Login failed');

            return new Response(JSON.stringify({
              access_token: json.access_token, refresh_token: json.refresh_token,
              token_type: 'bearer', expires_in: json.expires_in
            }), { status: 200, headers: { 'Content-Type': 'application/json' } });
          } catch (err) {
            return new Response(JSON.stringify({ error: 'invalid_grant', error_description: err.message }), { status: 400, headers: { 'Content-Type': 'application/json' } });
          }
        }

        // 4. Current User Profile (/api/me)
        if (url === '/api/me' || url.includes('/.netlify/identity/user')) {
          const authHeader = options.headers?.Authorization || options.headers?.authorization || '';
          const token = authHeader.replace('Bearer ', '');
          try {
            const userRes = await originalFetch(`${SUPABASE_URL}/auth/v1/user`, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
            });
            const user = await userRes.json();
            if (!userRes.ok || !user.id) return new Response(JSON.stringify({ error: 'Unauthorized' }), { status: 401 });

            if (options.method === 'PUT') {
              const body = JSON.parse(options.body || '{}');
              const profileRes = await originalFetch(`${SUPABASE_URL}/rest/v1/profiles`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'resolution=merge-duplicates,return=representation' },
                body: JSON.stringify({ id: user.id, ...body })
              });
              const profileJson = await profileRes.json();
              return new Response(JSON.stringify({ profile: Array.isArray(profileJson) ? profileJson[0] : profileJson }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            const profRes = await originalFetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${user.id}&select=*`, {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const profs = await profRes.json();
            const profile = Array.isArray(profs) ? profs[0] : null;

            if (url === '/api/me') {
              return new Response(JSON.stringify({ profile: profile || { slug: user.user_metadata?.digital_slug, name: user.user_metadata?.full_name } }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            } else {
              return new Response(JSON.stringify({
                id: user.id, email: user.email,
                user_metadata: { ...user.user_metadata, digital_slug: profile?.slug },
                app_metadata: user.app_metadata
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }
          } catch (err) {
            return new Response(JSON.stringify({ error: err.message }), { status: 500 });
          }
        }
      }
      return originalFetch.apply(this, arguments);
    };
  });
</script>
